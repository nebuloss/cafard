# cafard, in a container: /etc/systemd/system/cafard.service.d/container.conf
#
# INSTALLED ONLY WHEN THE STRICT UNIT WILL NOT START. deploy/install.sh tries
# the unit as shipped first and drops this in only if systemd fails it with
# status 226/NAMESPACE.
#
# The main unit asks the kernel for a read-only /proc/sys, hidden kernel
# modules and other mount-namespace tricks. In an UNPRIVILEGED container the
# kernel refuses them, and systemd fails the service with 226/NAMESPACE, which
# names nothing a person can act on and looks exactly like a broken binary.
#
# What is given up here is defence in depth against a compromised process.
# What is kept is everything that does not need to mount: no new privileges,
# no capabilities, a system call filter, no writable-and-executable memory,
# and write access to one directory. The container itself is the boundary
# those options were duplicating.

[Service]
# Mount-namespace options an unprivileged container cannot grant. Cleared
# rather than softened: a half-applied namespace is a confusing failure,
# where none at all is a documented one.
ProtectKernelTunables=no
ProtectKernelModules=no
ProtectKernelLogs=no
ProtectControlGroups=no
ProtectClock=no
ProtectHostname=no
ProtectProc=default

# The device cgroup belongs to the container's host here. Proxmox passes
# through only the devices listed in the container config (dev0: ...), which
# is the same allowlist the main unit set.
DevicePolicy=auto
DeviceAllow=

# ProtectSystem and ProtectHome DO work in a container, and they are what
# keeps the service from writing anywhere but its data directory. Left
# exactly as the main unit set them.
