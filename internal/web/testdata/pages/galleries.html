<!DOCTYPE html>

<html lang="en">

<title>Galleries of Lab - cafard</title>

<body data-page="galleries" class="shell">

<header class="topbar">
  <div class="bar">
    
    <svg class="mark" aria-hidden="true"><use href="/static/icons.svg#cafard"></use></svg>
    
    <h1>Galleries of Lab</h1>
    <span class="spacer"></span>
    
    <span class="connection only-scripted" data-component="ConnectionBadge" data-state="connecting" role="status" aria-live="polite">
      <span class="connection-dot" aria-hidden="true"></span><span class="connection-label" data-slot="label">connecting</span>
    </span>
    <span class="avatar" title="admin (human)">A</span>

</header>

<nav class="nav" aria-label="Main">
  <a class="nav-item" href="/" aria-current="page">
    <span class="nav-icon"><svg aria-hidden="true"><use href="/static/icons.svg#chat"></use></svg><span class="badge" data-badge="chats">2</span></span>
    <span class="nav-label">Chats</span>
  </a>
  <a class="nav-item" href="/live">
    <span class="nav-icon"><svg aria-hidden="true"><use href="/static/icons.svg#terminal"></use></svg></span>
    <span class="nav-label">Live</span>
  </a>
  <a class="nav-item" href="/streams">
    <span class="nav-icon"><svg aria-hidden="true"><use href="/static/icons.svg#sensors"></use></svg><span class="badge dot" data-badge="sources-down" title="A source is down" hidden></span></span>
    <span class="nav-label">Sources</span>
  </a>
  
  <a class="nav-item rail-only" href="/projects">

    <span class="nav-label">Projects</span>

  <a class="nav-item rail-only" href="/agents">

    <span class="nav-label">Agents</span>
  </a>
  <a class="nav-item rail-only" href="/pair">
    <span class="nav-icon"><svg aria-hidden="true"><use href="/static/icons.svg#qr_code"></use></svg></span>
    <span class="nav-label">Pair</span>
  </a>
  
  <details class="nav-more">
    <summary class="nav-item">
      <span class="nav-icon"><svg aria-hidden="true"><use href="/static/icons.svg#more_horiz"></use></svg></span>
      <span class="nav-label">More</span>
    </summary>
    <div class="menu" role="menu">
      
      <a class="menu-item bar-only" role="menuitem" href="/projects"><svg aria-hidden="true"><use href="/static/icons.svg#folder"></use></svg>Projects</a>
      <a class="menu-item bar-only" role="menuitem" href="/agents"><svg aria-hidden="true"><use href="/static/icons.svg#smart_toy"></use></svg>Agents</a>
      <a class="menu-item bar-only" role="menuitem" href="/pair"><svg aria-hidden="true"><use href="/static/icons.svg#qr_code"></use></svg>Pair a phone</a>
      
      <form class="theme-switch" method="post" action="/theme" aria-label="Theme">
        <input type="hidden" name="next" value="/projects/lab/g">
        <span class="menu-caption">Theme</span>
        <span class="segmented">
          <button type="submit" name="theme" value="system" aria-pressed="true">System</button>
          <button type="submit" name="theme" value="light" aria-pressed="false">Light</button>
          <button type="submit" name="theme" value="dark" aria-pressed="false">Dark</button>
        </span>
      </form>
      <form method="post" action="/signout">
        <button class="menu-item" type="submit" role="menuitem"><svg aria-hidden="true"><use href="/static/icons.svg#logout"></use></svg>Sign out admin</button>
      </form>
    </div>
  </details>

<main id="main">

  <ul class="list galleries-list">

</section>

</div>

</template>
