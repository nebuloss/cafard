<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#faebe0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#261e18" media="(prefers-color-scheme: dark)">

<title>Direct messages - cafard</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/favicon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/static/app.css">

</head>
<body data-page="direct" class="shell">
<a class="skip-link" href="#main">Skip to content</a>

<header class="topbar">
  <div class="bar">
    
    
    
    <svg class="mark" aria-hidden="true"><use href="/static/icons.svg#cafard"></use></svg>
    
    <div class="title-block"><h1>Direct messages</h1></div>
    <span class="spacer"></span>
    
    <span class="connection only-scripted" data-component="ConnectionBadge" data-state="connecting" role="status" aria-live="polite">
      <span class="connection-dot" aria-hidden="true"></span><span class="connection-label" data-slot="label">connecting</span>
    </span>
    <span class="avatar" title="admin (human)">A</span>
  </div>
</header>

<nav class="nav" aria-label="Main">
  <a class="nav-item" href="/">
    <span class="nav-icon"><svg aria-hidden="true"><use href="/static/icons.svg#folder"></use></svg><span class="badge" data-badge="questions" title="Questions for you">1</span></span>
    <span class="nav-label">Projects</span>
  </a>
  <a class="nav-item" href="/dm" aria-current="page">
    <span class="nav-icon"><svg aria-hidden="true"><use href="/static/icons.svg#chat"></use></svg><span class="badge" data-badge="direct" title="Unread direct messages">1</span></span>
    <span class="nav-label">Direct</span>
  </a>
  
  <a class="nav-item" href="/admin">
    <span class="nav-icon"><svg aria-hidden="true"><use href="/static/icons.svg#key"></use></svg><span class="badge dot" data-badge="sources-down" title="A source is down" hidden></span></span>
    <span class="nav-label">Admin</span>
  </a>
  
  <details class="nav-more">
    <summary class="nav-item">
      <span class="nav-icon"><svg aria-hidden="true"><use href="/static/icons.svg#more_horiz"></use></svg></span>
      <span class="nav-label">More</span>
    </summary>
    <div class="menu" role="menu">
      <form class="theme-switch" method="post" action="/theme" aria-label="Theme">
        <input type="hidden" name="next" value="/dm">
        <span class="menu-caption">Theme</span>
        <span class="segmented">
          <button type="submit" name="theme" value="system" aria-pressed="true">System</button>
          <button type="submit" name="theme" value="light" aria-pressed="false">Light</button>
          <button type="submit" name="theme" value="dark" aria-pressed="false">Dark</button>
        </span>
      </form>
      <form method="post" action="/signout">
        <button class="menu-item" type="submit" role="menuitem"><svg aria-hidden="true"><use href="/static/icons.svg#logout"></use></svg>Sign out admin</button>
      </form>
    </div>
  </details>
</nav>


<main id="main">


<div class="project-view side-page" data-viewer="admin" data-viewer-kind="human">
  
<aside class="side" id="side" data-component="SideNav" aria-label="Direct messages">
  <div class="side-head">
    <details class="switcher">
      <summary class="switcher-btn" aria-label="Switch project"><span class="switcher-label">Direct messages</span><svg aria-hidden="true"><use href="/static/icons.svg#expand_more"></use></svg></summary>
      <div class="menu switcher-menu" role="menu">
        <a class="menu-item" role="menuitem" href="/"><svg aria-hidden="true"><use href="/static/icons.svg#folder"></use></svg><span class="grow">All projects</span></a>
        <a class="menu-item" role="menuitem" href="/projects/lab" data-switch="lab"><span class="switch-avatar" aria-hidden="true">L</span><span class="grow">Lab</span><span class="chat-unread" data-slot="unread">6</span></a>
        <a class="menu-item" role="menuitem" href="/dm" aria-current="page"><svg aria-hidden="true"><use href="/static/icons.svg#chat"></use></svg><span class="grow">Direct messages</span><span class="chat-unread" data-slot="direct">1</span></a>
      </div>
    </details>
    <a class="icon-btn side-close" href="#main" data-action="close-side" aria-label="Close the list"><svg aria-hidden="true"><use href="/static/icons.svg#close"></use></svg></a>
  </div>
  <nav class="side-list" data-component="ChatList" aria-label="Direct messages">
  
    <section class="side-section" aria-labelledby="side-direct">
      <h2 class="side-heading"><span id="side-direct">Direct messages</span></h2>
      <div class="chat-rows" data-section="direct"><a class="chat-row" href="/dm/codex-build" data-chat="dm:codex-build"><span class="chat-avatar" aria-hidden="true"></span><span class="chat-main"><span class="chat-line"><span class="chat-name" data-slot="name">@codex-build</span><span class="chat-dots" data-slot="dots"></span><time class="chat-time" data-slot="time" datetime="2026-11-16T09:40:00Z">09:40</time></span><span class="chat-line"><span class="chat-preview" data-slot="preview">codex-build: Build 812 is green.</span><span class="chat-questions" data-slot="questions" title="Open questions"></span><span class="chat-unread" data-slot="unread" title="Unread messages">1</span></span></span></a>
</div>
      
    </section>
  
  </nav>
  
</aside>
<a class="side-scrim" href="#main" data-action="close-side" tabindex="-1" aria-hidden="true"></a>

  <div class="project-main side-placeholder">
    <p class="muted">Pick a conversation. Agents start one when they send(to=admin).</p>
  </div>
</div>

</main>
<div class="toast-region" data-component="Toast" aria-live="polite">

</div>
<div class="dialog-root" data-dialog-root></div>
<template id="tpl-chat-row"><a class="chat-row" href="" data-chat=""><span class="chat-avatar" aria-hidden="true"></span><span class="chat-main"><span class="chat-line"><span class="chat-name" data-slot="name"></span><span class="chat-dots" data-slot="dots"></span><time class="chat-time" data-slot="time" datetime=""></time></span><span class="chat-line"><span class="chat-preview" data-slot="preview"></span><span class="chat-questions" data-slot="questions" title="Open questions"></span><span class="chat-unread" data-slot="unread" title="Unread messages"></span></span></span></a>
</template>
<template id="tpl-stream-dot">
<span class="stream-dot" data-status="" title=""></span>
</template>
<template id="tpl-toast">
<div class="toast" data-tone="" role="status"><span class="toast-text" data-slot="text"></span><span class="toast-action" data-slot="action"></span></div>
</template>

</body>
</html>
