{{- /* One chat of the list (tpl-chat-row). The avatar's "#" or "@" comes
     from data-chat in CSS; muted rows are greyed. Data: ChatRowView. */ -}}
<a class="chat-row" href="{{.Href}}" data-chat="{{.ID}}"{{if .Pinned}} data-pinned{{end}}{{if .Muted}} data-muted{{end}}{{if .Archived}} data-archived{{end}}{{if .Active}} aria-current="page"{{end}}><span class="chat-avatar" aria-hidden="true"></span><span class="chat-main"><span class="chat-line"><span class="chat-name" data-slot="name">{{.Name}}</span><span class="chat-dots" data-slot="dots">{{range .Dots}}{{template "partials/stream_dot.html" .}}{{end}}</span><time class="chat-time" data-slot="time" datetime="{{.ISO}}">{{.Time}}</time></span><span class="chat-line"><span class="chat-preview" data-slot="preview">{{.Preview}}</span><span class="chat-questions" data-slot="questions" title="Open questions">{{.Questions}}</span><span class="chat-unread" data-slot="unread" title="Unread messages">{{.Unread}}</span></span></span></a>
