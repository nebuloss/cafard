{{/* Empty state of Live and Sources (PLAN 9.6.6): ready-to-paste commands
     with public_url filled in. Data: []dto.Snippet. */}}
<section class="empty card outlined" aria-labelledby="empty-sources-title">
  <h2 id="empty-sources-title">No logs yet</h2>
  <p class="muted">Send a first line from any machine on the network. Make a token on the Agents page for the commands that need one.</p>
  {{range .}}
  <figure class="snippet">
    <figcaption class="label">{{.Label}}</figcaption>
    <pre class="mono" data-language="{{.Language}}"><code>{{.Text}}</code></pre>
  </figure>
  {{end}}
</section>
