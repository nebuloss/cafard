{{/* The range bar of a logs view (RangeBar): the selected range's line
     count and its actions. Bundle only. */}}
<div class="range-bar only-scripted" data-component="RangeBar" role="toolbar" aria-label="Selected lines" hidden>
  <span class="range-count" data-slot="count"></span>
  <button class="btn filled" type="button" data-action="attach"><svg aria-hidden="true"><use href="/static/icons.svg#description"></use></svg>Attach</button>
  <button class="btn text" type="button" data-action="copy">Copy</button>
  <button class="btn text" type="button" data-action="cancel">Cancel</button>
</div>
