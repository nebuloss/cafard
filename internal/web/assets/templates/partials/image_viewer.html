{{/* The image viewer (ImageViewer): the original, native pinch zoom, and
     previous/next. Without the bundle each tile is a plain link. */}}
<dialog class="image-viewer" data-component="ImageViewer" aria-label="Photo">
  <img data-slot="img" alt="">
  <button class="icon-btn viewer-close" type="button" data-action="close" aria-label="Close"><svg aria-hidden="true"><use href="/static/icons.svg#close"></use></svg></button>
  <button class="icon-btn viewer-prev" type="button" data-action="prev" aria-label="Previous photo"><svg aria-hidden="true"><use href="/static/icons.svg#chevron_left"></use></svg></button>
  <button class="icon-btn viewer-next" type="button" data-action="next" aria-label="Next photo"><svg aria-hidden="true"><use href="/static/icons.svg#chevron_right"></use></svg></button>
  <a class="btn text viewer-open" data-slot="open" href="#" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="/static/icons.svg#open_in_new"></use></svg>Original</a>
</dialog>
