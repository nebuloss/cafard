{{/* The header row of a sources table: on Sources and in a project's
     logs. */}}
<div class="stream-head" role="row">
  <span role="columnheader">Source</span>
  <span role="columnheader">Status</span>
  <span role="columnheader">Kind / transport</span>
  <span role="columnheader">Lines/min</span>
  <span role="columnheader">Last activity</span>
  <span role="columnheader">Last line</span>
  <span role="columnheader">Dropped</span>
  <span role="columnheader">Claim</span>
  <span role="columnheader">Lines</span>
  <span role="columnheader"><span class="visually-hidden">Open</span></span>
</div>
