{{/* The form that makes a project (admin interface): on home and on the
     Projects page. */}}
<form class="card outlined narrow stack" method="post" action="/projects">
  <label class="ofield">
    <span>Name</span>
    <input name="name" required placeholder="lab" autocomplete="off" autocapitalize="off" spellcheck="false" pattern="[a-z0-9][a-z0-9._\-]{0,39}">
  </label>
  <label class="ofield">
    <span>Title</span>
    <input name="title" placeholder="Lab bench" maxlength="200">
  </label>
  <p class="help">The name is in every stream id of the project (chan:lab/general, serial:lab/dut1), so it cannot change. The project starts with #general and the configured retention.</p>
  <button class="btn filled" type="submit">Make project</button>
</form>
