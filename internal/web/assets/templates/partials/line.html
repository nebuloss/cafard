{{/* One log line (tpl-line). Text spans carry only classes from the fixed
     ANSI list; colour values never come from the input. */}}
<div class="line" role="listitem" data-seq="{{.Seq}}" data-sev="{{.Sev}}" data-tone="{{.Tone}}"><time class="line-time" data-slot="time" datetime="{{.ISO}}">{{.Time}}</time><span class="line-stream" data-slot="stream">{{.Stream}}</span><abbr class="line-sev" data-slot="sev" title="{{.SevName}}">{{.SevLetter}}</abbr><span class="line-text" data-slot="text">{{range .Segments}}{{if .Class}}<span class="{{.Class}}">{{.Text}}</span>{{else}}{{.Text}}{{end}}{{end}}</span></div>
