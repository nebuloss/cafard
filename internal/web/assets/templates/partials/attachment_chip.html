{{- /* An attachment waiting in the composer (tpl-attachment-chip): a photo
     or a log slice, removable before sending. Data: AttachmentChipView. */ -}}
<span class="chip attachment-chip" data-kind="{{.Kind}}" data-index="{{.Index}}"><span class="chip-label" data-slot="label">{{.Label}}</span><button class="chip-remove" type="button" data-slot="remove" aria-label="Remove"><svg aria-hidden="true"><use href="/static/icons.svg#close"></use></svg></button></span>
