name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check and build the frontend
        run: |
          npm run typecheck
          npm test
          npm run build
          test -s internal/web/assets/static/app/main.js
          scripts/check-sinks.sh

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false

      - name: Test
        run: go test -race ./...

      # Static, cgo off, frontend embedded: each file is the whole
      # application. The Windows builds are for `cafard push` and `cafard term`.
      - name: Build for every target
        env:
          CGO_ENABLED: '0'
        run: |
          version="${GITHUB_REF_NAME#v}"
          build() {
            GOOS="$1" GOARCH="$2" GOARM="${4:-}" go build \
              -trimpath \
              -ldflags="-s -w -X main.version=$version" \
              -o "$3" ./cmd/cafard
            echo "  $3: $(stat -c%s "$3") bytes"
          }
          build linux   amd64 cafard-linux-amd64
          build linux   arm64 cafard-linux-arm64
          build linux   arm   cafard-linux-armv7 7
          build windows amd64 cafard-windows-amd64.exe
          build windows arm64 cafard-windows-arm64.exe

      - name: Smoke test the linux amd64 build
        run: |
          printed=$(./cafard-linux-amd64 version)
          echo "$printed"
          case "$printed" in
            *"${GITHUB_REF_NAME#v}") ;;
            *) echo "the binary does not report the tagged version"; exit 1 ;;
          esac

      - name: Checksums
        run: sha256sum cafard-linux-* cafard-windows-* > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cafard-linux-amd64
            cafard-linux-arm64
            cafard-linux-armv7
            cafard-windows-amd64.exe
            cafard-windows-arm64.exe
            SHA256SUMS
          generate_release_notes: true
