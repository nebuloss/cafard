name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Separate from build: vite strips types without checking them.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Go embeds whatever is in this directory, so an empty bundle would
      # ship a binary without the frontend and nothing else would fail.
      - name: Check the bundle was produced
        run: |
          test -s internal/web/assets/static/app/main.js
          echo "main.js: $(stat -c%s internal/web/assets/static/app/main.js) bytes"

      - name: No HTML sinks in src/
        run: scripts/check-sinks.sh

      - uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: internal/web/assets/static/app/main.js
          retention-days: 1
          if-no-files-found: error

  server:
    name: Server
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false

      - uses: actions/download-artifact@v4
        with:
          name: frontend
          path: internal/web/assets/static/app

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "go.mod or go.sum is not tidy. Run: go mod tidy"
            git diff go.mod go.sum
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

      # Fixtures and rendered pages written by Go tests are read by the
      # TypeScript tests, so a stale copy means the two sides drifted.
      - name: Check generated test data is up to date
        run: |
          if [ -n "$(git status --porcelain -- internal/web/testdata)" ]; then
            echo "internal/web/testdata is stale. Run the Go tests with -update and commit."
            git status --porcelain -- internal/web/testdata
            exit 1
          fi

  cross-build:
    name: Cross-build
    runs-on: ubuntu-latest
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm, goarm: '7' }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false

      - uses: actions/download-artifact@v4
        with:
          name: frontend
          path: internal/web/assets/static/app

      # cgo stays off everywhere. A dependency that quietly needs it breaks
      # these targets without breaking a single test.
      - name: Build for ${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm }}
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build -trimpath -ldflags='-s -w' -o /dev/null ./cmd/cafard

  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: |
          shellcheck scripts/*.sh deploy/*.sh deploy/cafard.openrc
          # POSIX sh: it runs on busybox in Alpine containers.
          shellcheck -s sh deploy/install.sh

      - name: Check install.sh parses as POSIX sh
        run: sh -n deploy/install.sh

      # The binary is not installed here, so verify a copy pointing at one
      # that exists; everything else is checked as shipped.
      - name: Check the systemd unit and the container drop-in
        run: |
          dir=$(mktemp -d)
          sed 's|/usr/local/bin/cafard|/bin/true|' deploy/cafard.service > "$dir/cafard.service"
          mkdir "$dir/cafard.service.d"
          cp deploy/cafard-container.conf "$dir/cafard.service.d/container.conf"
          systemd-analyze verify "$dir/cafard.service"
